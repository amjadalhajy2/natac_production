<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>تسجيل الدخول | NATAC</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-1: #eaf1ff;
      --bg-2: #f7f1ea;
      --text: #101827;
      --muted: #667085;
      --line: rgba(16, 24, 39, 0.12);
      --card: rgba(255, 255, 255, 0.90);
      --card-strong: rgba(255, 255, 255, 0.98);
      --input: rgba(255, 255, 255, 0.98);
      --blue: #0066ff;
      --blue-dark: #004ec2;
      --purple: #6d28d9;
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 22px 60px rgba(16, 24, 39, 0.14);
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 12%, rgba(0, 102, 255, 0.28), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(109, 40, 217, 0.20), transparent 30%),
        linear-gradient(135deg, var(--bg-1), #ffffff 52%, var(--bg-2));
      background-attachment: fixed;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .login-card {
      width: min(440px, 100%);
      padding: 24px;
      border-radius: var(--radius-xl);
      background: var(--card);
      border: 1px solid rgba(16,24,39,0.10);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
    }

    .login-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(16,24,39,0.10);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-box {
      width: 54px;
      height: 54px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(16,24,39,0.08);
      flex-shrink: 0;
    }

    .logo-box img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      min-width: 0;
      text-align: start;
    }

    .brand-title strong {
      display: block;
      font-size: 21px;
      font-weight: 900;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .language-toggle {
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
      min-width: 44px;
      height: 42px;
      font-size: 16px;
      flex-shrink: 0;
    }

    .form-title {
      margin: 0 0 20px;
      font-size: 28px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.4px;
      text-align: start;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 900;
      color: var(--text);
      text-align: start;
    }

    input {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(16,24,39,0.18);
      border-radius: 16px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 15px;
      background: var(--input);
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 0 rgba(16,24,39,0.03);
      transition: 0.18s ease;
    }

    input::placeholder {
      color: #98a2b3;
    }

    input:focus {
      border-color: rgba(0, 102, 255, 0.65);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.13);
      background: #fff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-inline-end: 52px;
    }

    .toggle-password {
      position: absolute;
      inset-inline-end: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 13px;
      background: rgba(0, 102, 255, 0.08);
      color: var(--blue-dark);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      padding: 0 22px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
      margin-top: 6px;
    }

    .btn-primary {
      background: linear-gradient(145deg, #0066ff, #5b21b6);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 102, 255, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(0, 102, 255, 0.27);
    }

    .btn:disabled {
      opacity: 0.68;
      cursor: not-allowed;
      transform: none;
    }

    .mini-spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.45);
      border-top-color: #fff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.75s linear infinite;
    }

    .message {
      display: none;
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      min-width: min(520px, calc(100vw - 28px));
      max-width: calc(100vw - 28px);
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.7;
      border: 1px solid transparent;
      box-shadow: 0 18px 48px rgba(16, 24, 39, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: rgba(254, 242, 242, 0.96);
      border-color: #fecaca;
    }

    .message.success {
      display: block;
      color: #166534;
      background: rgba(240, 253, 244, 0.96);
      border-color: #bbf7d0;
    }

    .message.warning {
      display: block;
      color: #9a3412;
      background: rgba(255, 247, 237, 0.96);
      border-color: #fed7aa;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 18px;
        border-radius: 24px;
      }

      .logo-box {
        width: 50px;
        height: 50px;
      }

      .brand-title strong {
        font-size: 19px;
      }

      .form-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <div id="messageBox" class="message"></div>

  <main class="login-card">
    <div class="login-head">
      <div class="brand">
        <div class="logo-box">
          <img src="assets/img/logo.png" alt="NATAC Logo">
        </div>
        <div class="brand-title">
          <strong id="factoryName">ناتاك</strong>
        </div>
      </div>

      <button id="languageToggleBtn" class="language-toggle" type="button">EN</button>
    </div>

    <h1 class="form-title" id="loginTitle">تسجيل الدخول</h1>

    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label for="username" id="usernameLabel">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password" id="passwordLabel">كلمة المرور</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" />
          <button id="togglePasswordBtn" class="toggle-password" type="button">👁</button>
        </div>
      </div>

      <button class="btn btn-primary" type="submit" id="loginBtn">دخول</button>
    </form>
  </main>

  <script>
    /********************************************************
     * Supabase Settings
     * ضع بيانات مشروعك هنا فقط
     * لا تضع service_role key هنا نهائيًا
     ********************************************************/

const SUPABASE_URL = "https://qibzyzemucsmzghmdsfx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ONQ53W21vehUTCCg-uqd5A_JFlhAc5-";

    const SESSION_KEY = "factoryUserSession";
    const LANGUAGE_KEY = "factoryLanguage";
    const SESSION_VALIDATION_MAX_AGE_MS = 300000;
    const REMEMBERED_USERNAME_KEY = "factoryRememberedUsername";

    let supabaseClient = null;

    if (
      window.supabase &&
      SUPABASE_URL &&
      SUPABASE_ANON_KEY &&
      !SUPABASE_URL.includes("ضع رابط") &&
      !SUPABASE_ANON_KEY.includes("ضع anon")
    ) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const i18n = {
      ar: {
        htmlLang: "ar",
        dir: "rtl",
        pageTitle: "تسجيل الدخول | ناتاك",
        languageButton: "EN",
        factoryName: "ناتاك",
        loginTitle: "تسجيل الدخول",
        username: "اسم المستخدم",
        password: "كلمة المرور",
        login: "دخول",
        loggingIn: "جاري الدخول...",
        checkingSession: "جاري التحقق...",
        missingFields: "يرجى إدخال اسم المستخدم وكلمة المرور",
        loginSuccess: "تم تسجيل الدخول بنجاح",
        serverError: "تعذر الاتصال بقاعدة البيانات. تحقق من إعدادات Supabase أو اتصال الإنترنت.",
        supabaseNotConfigured: "يرجى وضع رابط Supabase والمفتاح العام داخل الصفحة.",
        sessionExpired: "انتهت الجلسة، يرجى تسجيل الدخول مرة أخرى"
      },
      en: {
        htmlLang: "en",
        dir: "ltr",
        pageTitle: "Login | NATAC",
        languageButton: "عربي",
        factoryName: "NATAC",
        loginTitle: "Login",
        username: "Username",
        password: "Password",
        login: "Login",
        loggingIn: "Signing in...",
        checkingSession: "Checking...",
        missingFields: "Please enter username and password",
        loginSuccess: "Signed in successfully",
        serverError: "Unable to connect to the database. Check Supabase settings or internet connection.",
        supabaseNotConfigured: "Please set Supabase URL and public key inside this page.",
        sessionExpired: "Session expired. Please sign in again"
      }
    };

    let currentLang = localStorage.getItem(LANGUAGE_KEY) || "ar";
    let messageTimer = null;

    const messageBox = document.getElementById("messageBox");
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const languageToggleBtn = document.getElementById("languageToggleBtn");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    const factoryName = document.getElementById("factoryName");
    const loginTitle = document.getElementById("loginTitle");
    const usernameLabel = document.getElementById("usernameLabel");
    const passwordLabel = document.getElementById("passwordLabel");

    document.addEventListener("DOMContentLoaded", () => {
      applyLanguage(currentLang);
      bindEvents();
      restoreRememberedUsername();

      if (!isSupabaseReady()) {
        showMessage(i18n[currentLang].supabaseNotConfigured, "warning");
        usernameInput.focus();
        return;
      }

      checkExistingSessionFast();
    });

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANGUAGE_KEY, lang);

      document.documentElement.lang = i18n[lang].htmlLang;
      document.documentElement.dir = i18n[lang].dir;
      document.title = i18n[lang].pageTitle;

      factoryName.textContent = i18n[lang].factoryName;
      loginTitle.textContent = i18n[lang].loginTitle;
      usernameLabel.textContent = i18n[lang].username;
      passwordLabel.textContent = i18n[lang].password;
      loginBtn.textContent = i18n[lang].login;
      languageToggleBtn.textContent = i18n[lang].languageButton;
    }

    function bindEvents() {
      languageToggleBtn.addEventListener("click", () => {
        const nextLang = currentLang === "ar" ? "en" : "ar";
        applyLanguage(nextLang);
      });

      togglePasswordBtn.addEventListener("click", () => {
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
      });

      loginForm.addEventListener("submit", handleLogin);
    }

    function restoreRememberedUsername() {
      const rememberedUsername = localStorage.getItem(REMEMBERED_USERNAME_KEY) || "";

      if (rememberedUsername && !usernameInput.value) {
        usernameInput.value = rememberedUsername;
        passwordInput.focus();
      } else {
        usernameInput.focus();
      }
    }

    function isSupabaseReady() {
      return Boolean(supabaseClient);
    }

    async function checkExistingSessionFast() {
      const session = getSession();

      if (!session || !session.token) {
        return;
      }

      if (isSessionRecentlyValidated(session)) {
        redirectToDashboard();
        return;
      }

      setLoading(true, i18n[currentLang].checkingSession);

      try {
        const result = await checkSessionWithSupabase(session.token);

        if (result && result.success) {
          const normalizedUser = normalizeUser(result.user || session.user || {});
          saveSession(session.token, normalizedUser);
          redirectToDashboard();
          return;
        }

        localStorage.removeItem(SESSION_KEY);
        setLoading(false);

      } catch (error) {
        console.warn(error);
        setLoading(false);
      }
    }

    function isSessionRecentlyValidated(session) {
      const validatedAt = Number(session.validatedAt || 0);

      if (!validatedAt) return false;

      return Date.now() - validatedAt <= SESSION_VALIDATION_MAX_AGE_MS;
    }

    async function handleLogin(event) {
      event.preventDefault();
      clearMessage();

      if (!isSupabaseReady()) {
        showMessage(i18n[currentLang].supabaseNotConfigured, "warning");
        return;
      }

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password.trim()) {
        showMessage(i18n[currentLang].missingFields, "error");
        return;
      }

      setLoading(true, i18n[currentLang].loggingIn);

      try {
        const result = await loginWithSupabase(username, password);

        if (!result || !result.success) {
          setLoading(false);
          showMessage((result && result.message) || i18n[currentLang].serverError, "error");
          return;
        }

        const normalizedUser = normalizeUser(result.user || {});

        localStorage.setItem(REMEMBERED_USERNAME_KEY, username);
        clearDataCachesAfterLogin_();
        saveSession(result.token, normalizedUser);
        showMessage(result.message || i18n[currentLang].loginSuccess, "success");

        setTimeout(() => {
          redirectToDashboard();
        }, 250);

      } catch (error) {
        console.error(error);
        setLoading(false);
        showMessage(i18n[currentLang].serverError, "error");
      }
    }

    /********************************************************
     * Supabase RPC Calls
     * يجب أن تكون هذه الدوال منشأة في SQL Editor:
     * custom_login(p_username, p_password)
     * get_session_user(p_token)
     ********************************************************/

    async function loginWithSupabase(username, password) {
      const { data, error } = await supabaseClient.rpc("custom_login", {
        p_username: username,
        p_password: password
      });

      if (error) {
        console.error("custom_login error:", error);
        return {
          success: false,
          message: i18n[currentLang].serverError
        };
      }

      return data;
    }

    async function checkSessionWithSupabase(token) {
      const { data, error } = await supabaseClient.rpc("get_session_user", {
        p_token: token
      });

      if (error) {
        console.error("get_session_user error:", error);
        return {
          success: false,
          message: i18n[currentLang].sessionExpired
        };
      }

      return data;
    }

    /********************************************************
     * Session Compatibility
     * هذه الدالة تحفظ البيانات بصيغة متوافقة مع باقي الصفحات الحالية
     ********************************************************/

    function normalizeUser(user) {
      const permissions = user.Permissions || user.permissions || {};

      return {
        id: user.id || "",
        userCode: user.userCode || user.user_code || user.UserID || user.user_id || "",
        fullName: user.fullName || user.full_name || user.FullName || "",
        username: user.username || user.Username || "",
        role: user.role || user.Role || "",
        status: user.status || user.Status || "",
        permissions: permissions,

        UserID: user.UserID || user.userCode || user.user_code || user.id || "",
        FullName: user.FullName || user.fullName || user.full_name || "",
        Username: user.Username || user.username || "",
        Role: user.Role || user.role || "",
        Status: user.Status || user.status || "",
        Permissions: permissions
      };
    }

    function saveSession(token, user) {
      const normalizedUser = normalizeUser(user);
      const permissions = normalizedUser.Permissions || normalizedUser.permissions || {};

      const session = {
        token: token,

        user: normalizedUser,

        id: normalizedUser.id || "",
        userCode: normalizedUser.userCode || "",
        fullName: normalizedUser.fullName || "",
        username: normalizedUser.username || "",
        role: normalizedUser.role || "",
        status: normalizedUser.status || "",
        permissions: permissions,

        UserID: normalizedUser.UserID || "",
        FullName: normalizedUser.FullName || "",
        Username: normalizedUser.Username || "",
        Role: normalizedUser.Role || "",
        Status: normalizedUser.Status || "",
        Permissions: permissions,

        validatedAt: Date.now()
      };

      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    }

    function getSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (error) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }

    function clearDataCachesAfterLogin_() {
      const prefixes = [
        "dashboard_cache",
        "production_initial_data",
        "history_cache",
        "products_page_data",
        "machines_page_data",
        "workers_page_data",
        "workers_cache",
        "users_page_cache",
        "profile_cache",
        "performance_workers_cache",
        "performance_results_cache"
      ];

      Object.keys(localStorage).forEach(function(key) {
        if (prefixes.some(function(prefix) { return key.indexOf(prefix) === 0; })) {
          localStorage.removeItem(key);
        }
      });
    }

    function redirectToDashboard() {
      window.location.replace("dashboard.html");
    }

    function setLoading(isLoading, text) {
      loginBtn.disabled = isLoading;

      if (isLoading) {
        loginBtn.innerHTML = '<span class="mini-spinner"></span>' + (text || i18n[currentLang].loggingIn);
      } else {
        loginBtn.textContent = i18n[currentLang].login;
      }
    }

    function showMessage(text, type) {
      clearTimeout(messageTimer);

      messageBox.textContent = text;
      messageBox.className = "message " + type;

      messageTimer = setTimeout(() => {
        clearMessage();
      }, 3000);
    }

    function clearMessage() {
      clearTimeout(messageTimer);
      messageBox.textContent = "";
      messageBox.className = "message";
    }
  </script>
</body>
</html>
